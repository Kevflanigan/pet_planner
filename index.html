<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PETS BEHAVING – We know who is looking after our pets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f0;--card:#fff;--ink:#0b2a45;--mute:#56707f;--line:#d3e2de;--brand:#0a7a58;--brand-d:#082d4d;--brand-h:#07604a;--cream:#fcfcf1;--dog:#d98a1f;--cat:#6c5bd0;--lock:#dcefec;--warn:#b3361f;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px 60px}
header.top{background:var(--brand-d);color:#fff}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px}
.logo{font:800 22px 'Bricolage Grotesque',sans-serif}
.session{display:flex;align-items:center;gap:8px;font-size:14px}
.session .dot{width:9px;height:9px;border-radius:50%;background:#5fe08f}
.session span.em{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;font-weight:600}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-h)}
.btn.ghost-w{background:transparent;border-color:#ffffff66;color:#fff;padding:5px 10px;font-size:14px}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 6px}
.bar h2{font-size:26px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(520px,100%)}
.login{max-width:400px;margin:70px auto;background:var(--card);padding:28px;border-radius:14px;border:1px solid var(--line)}
.login h1{font-size:30px;margin-bottom:6px}
.login p{color:var(--mute);margin:0 0 18px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=email],input[type=date],input[type=time],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:60px;resize:vertical}
.month{margin-top:26px}
.month h3{font-size:22px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:12px;color:var(--mute);text-align:center;font-weight:600}
.day{min-height:78px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:5px 6px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.day:hover{border-color:var(--brand)}
.day .n{font-weight:600;font-size:14px}
.day.we{background:#f8faf4}
.day.past{opacity:.55}
.day.today{border:2px solid var(--brand)}
.day.locked{background:var(--lock);border-style:dashed}
.day .pets{display:flex;gap:3px;flex-wrap:wrap}
.pip{width:9px;height:9px;border-radius:50%}
.pip.Dog{background:var(--dog)}.pip.Cat{background:var(--cat)}
.day .earn{font:800 14px 'Bricolage Grotesque',sans-serif;color:var(--brand)}
.day .earn.zero{color:#a9b9be;font-weight:600}
.blank{visibility:hidden}
.weeks{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:30px}
.weeks p.sub{color:var(--mute);margin:4px 0 12px;font-size:14px}
.wk{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:8px 10px;padding:10px 0;border-top:1px solid var(--line)}.wk>[data-lock]{grid-column:4;justify-self:end}
.wk .info{min-width:0}
.wk .info b{display:block}
.wk .info small{color:var(--mute)}
.tag{font-size:12px;font-weight:600;background:var(--lock);padding:2px 8px;border-radius:99px;color:var(--brand-d)}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);max-height:92vh;box-shadow:0 20px 60px #0004}
dialog::backdrop{background:#0a1a2099}
.dlg{padding:20px}
.dlg h2{font-size:24px;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.row{grid-template-columns:1fr}.day{min-height:64px;padding:3px 4px}.day .earn{font-size:12px}.grid{gap:3px}}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choices label{margin:0;font-weight:500;cursor:pointer}
.choices input{position:absolute;opacity:0}
.choices span{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:99px}
.choices input:checked+span{background:var(--brand);color:#fff;border-color:var(--brand)}
.choices input:focus-visible+span{outline:3px solid var(--brand);outline-offset:2px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.visit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.visit .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.visit small{display:block;color:var(--mute)}
.preview{background:#f6f9fa;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:46vh;overflow:auto;font-size:14px;white-space:pre-wrap}
.msg{color:var(--warn);font-size:14px;min-height:20px}
.empty{color:var(--mute);margin:10px 0}
.banner{background:#fff6e0;border:1px solid #f0d9a0;border-radius:10px;padding:10px 14px;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tag.paid{background:#d9f2e1;color:#14572d}
details summary{cursor:pointer;font-size:14px;color:var(--brand);font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}
th:first-child,td:first-child{text-align:left}
.pip.done{box-shadow:0 0 0 2px #5fe08f}
@media print{#app,header.top{display:none}dialog{position:static;box-shadow:none;width:100%;max-height:none}dialog::backdrop{display:none}.actions,#rd,label[for=rd]{display:none}}
.logo{font-size:14px;flex:1;min-width:0;line-height:1.15;letter-spacing:.02em}
.logo small{display:block;font:400 12px/1.3 Figtree,sans-serif;letter-spacing:0;opacity:.85;margin-top:2px}
header.top .wrap{padding:12px 14px}
.session{flex:none}
.bar{margin:14px 0 4px}
.bar h2{font-size:22px}
.nav .btn{padding:9px 14px;text-align:center;min-width:0}
.hint{color:var(--mute);font-size:14px;margin:0 0 8px}
.month{margin-top:16px}
.month h3{font-size:19px}
.weeks{margin-top:20px}
@media(max-width:480px){.wrap{padding-left:10px;padding-right:10px}.logo{font-size:14px}.session{gap:6px}.btn.ghost-w{padding:4px 8px;font-size:13px}.bar h2{font-size:20px}.day{min-height:66px}}
@media(max-width:480px){.wk{grid-template-columns:minmax(0,1fr) auto;gap:8px}.wk .info{grid-column:1}.wk [data-send],.wk [data-inv]{grid-column:1}.wk [data-lock]{grid-column:2;grid-row:1 / span 3;align-self:center;justify-self:end}}
.banner.warn{background:#fdecea;border-color:#f3b7ae}
.logo-img{display:block;margin:0 auto 14px;width:min(280px,78%);height:auto}
body.authpage{background:var(--cream)}
.authpage .login{background:transparent;border:0;margin-top:20px;padding-top:6px}
@media(prefers-reduced-motion:no-preference){dialog[open]{animation:pop .15s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}
</style>
</head>

const WEEKDAY_PRICE = 12, WEEKEND_PRICE = 15;
const SLOTS = {Morning:'08:00', Afternoon:'13:00', Evening:'18:00'};
const ACCESS = ['Client provided key','Key safe / Lockbox code','Owner will be home'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'v' + Date.now() + Math.random().toString(36).slice(2,8);
const pad = n => String(n).padStart(2,'0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const money = n => '£' + (Number.isInteger(n) ? n : n.toFixed(2));
const priceFor = k => [0,6].includes(parse(k).getDay()) ? WEEKEND_PRICE : WEEKDAY_PRICE;
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtDay = d => d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const todayKey = key(new Date());

const DEFAULT_SERVICE = 'PETS BEHAVING';
const TAGLINE = 'We know who is looking after our pets';
let savedSvc = localStorage.getItem('petrounds:service');
if(savedSvc === 'Pets, Paws and More'){ savedSvc = null; localStorage.removeItem('petrounds:service'); }
let state = { user: sb ? null : (localStorage.getItem('petrounds:session') || 'demo@petsbehaving.local'), uid: null, cloudReady: false, loadError: false, sync: '', syncErr: false, profile: null, authView: REF_PARAM ? 'register' : 'login', ent: null, share: null, refs: [], pendingEmail: '', loading: !!sb, service: savedSvc || DEFAULT_SERVICE, visits: [], locked: {}, invoices: {}, pay: '', offset: 0 };

function load(){
  if(!state.user || sb) return;
  try { const s = JSON.parse(localStorage.getItem('petrounds:data:'+state.user)); if(s){ state.visits = s.visits||[]; state.locked = s.locked||{}; state.invoices = s.invoices||{}; state.pay = s.pay||''; } } catch(e){}
}
function canWrite(){ return !sb || !state.ent || state.ent.has_access; }
function blocked(){
  show(`<h2>Your access has ended</h2><p class="empty">You can still log in and view your visits. Adding or changing visits needs an active trial or subscription.</p><div class="actions"><button class="btn primary" id="x">OK</button></div>`);
  $('#x').onclick = close;
}
function save(){
  if(sb){
    if(!canWrite()){ blocked(); loadCloud().then(() => render()).catch(() => {}); return; }
    queueSync(); return;
  }
  try { localStorage.setItem('petrounds:data:'+state.user, JSON.stringify({visits:state.visits, locked:state.locked, invoices:state.invoices, pay:state.pay})); } catch(e){}
}
if(state.user){ try { state.profile = JSON.parse(localStorage.getItem('petrounds:profile:' + state.user)); } catch(e){} }
const visitsOn = k => state.visits.filter(v => v.date === k).sort((a,b) => a.time.localeCompare(b.time));
const isLocked = k => !!state.locked[key(mondayOf(parse(k)))];
const visitPrice = v => typeof v.price === 'number' ? v.price : priceFor(v.date);
const sumPrice = vs => vs.reduce((s,v) => s + visitPrice(v), 0);
const dayTotal = k => sumPrice(visitsOn(k));
function weekVisits(mk){
  const start = parse(mk), ks = Array.from({length:7},(_,i)=>key(addDays(start,i)));
  return state.visits.filter(v => ks.includes(v.date)).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
}
const weekTotal = mk => sumPrice(weekVisits(mk));

const fmtLong = d => d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
function households(mk){
  const m = {};
  weekVisits(mk).forEach(v => { const e = (v.hemail||'').toLowerCase(); (m[e] = m[e] || {email:e, name:v.hname||'Household', visits:[]}).visits.push(v); });
  return Object.values(m);
}
const inv = (mk,e) => state.invoices[mk+'|'+e] || {};
const invNo = (mk,e) => 'INV-' + mk.replace(/-/g,'') + '-' + String(Math.abs([...e].reduce((a,c) => (a*31 + c.charCodeAt(0))|0, 7)) % 1000).padStart(3,'0');
function invoiceText(mk,h){
  const s = parse(mk), e = addDays(s,6), L = [];
  L.push(`INVOICE ${invNo(mk,h.email)}`, state.service, `From: ${state.user}`, '', `To: ${h.name}${h.email ? ' <'+h.email+'>' : ''}`,
    `Issued: ${fmtLong(e)}`, `Due: ${fmtLong(addDays(e,7))}`, `Week: ${fmtDay(s)} to ${fmtDay(e)}`, '');
  h.visits.forEach(v => L.push(`${fmtDay(parse(v.date))} ${v.time}  ${v.name} (${v.type})  ${money(visitPrice(v))}`));
  L.push('', `TOTAL DUE: ${money(sumPrice(h.visits))}`);
  if(state.pay) L.push('', 'How to pay:', state.pay);
  L.push('', 'Thank you!');
  return L.join('\n');
}
function dueWeeks(){
  const mons = [...new Set(state.visits.map(v => key(mondayOf(parse(v.date)))))].sort();
  return mons.filter(mk => key(addDays(parse(mk),6)) < todayKey && households(mk).some(h => !inv(mk,h.email).sent));
}

/* ---------- rendering ---------- */
const COLS = ['id','date','time','slot','name','type','address','postcode','hname','hemail','price','food','meds','vet','notes','access','keycode','done'];
const toRow = v => { const r = {}; COLS.forEach(c => { r[c] = v[c] === undefined ? (c === 'done' ? false : null) : v[c]; }); return r; };
let syncTimer, cloudIds = new Set();
function setSync(t, err){ state.sync = t; state.syncErr = !!err; const el = $('#sync'); if(el){ el.textContent = t; el.style.color = err ? 'var(--warn)' : ''; } }
function queueSync(){ clearTimeout(syncTimer); setSync('Saving…'); syncTimer = setTimeout(syncNow, 500); }
async function syncNow(){
  try {
    const rows = state.visits.map(toRow);
    if(rows.length){ const r = await sb.from('visits').upsert(rows); if(r.error) throw r.error; }
    const gone = [...cloudIds].filter(id => !state.visits.some(v => v.id === id));
    if(gone.length){ const r = await sb.from('visits').delete().in('id', gone); if(r.error) throw r.error; }
    cloudIds = new Set(state.visits.map(v => v.id));
    const r2 = await sb.from('settings').upsert({user_id:state.uid, locked:state.locked, invoices:state.invoices, pay:state.pay, updated_at:new Date().toISOString()});
    if(r2.error) throw r2.error;
    if(state.clearLocal){ localStorage.removeItem('petrounds:data:' + state.user); state.clearLocal = false; }
    setSync('Saved');
  } catch(e){ setSync('Not saved. Check your connection.', true); }
}
async function loadCloud(){
  const [v, st] = await Promise.all([sb.from('visits').select('*').order('date').limit(5000), sb.from('settings').select('*').maybeSingle()]);
  if(v.error) throw v.error;
  if(st.error) throw st.error;
  state.visits = v.data.map(r => ({...r, price: r.price == null ? undefined : Number(r.price)}));
  state.locked = (st.data && st.data.locked) || {};
  state.invoices = (st.data && st.data.invoices) || {};
  state.pay = (st.data && st.data.pay) || '';
  cloudIds = new Set(state.visits.map(x => x.id));
  try {
    const [en, sh, rf] = await Promise.all([sb.rpc('get_my_entitlement'), sb.rpc('get_my_share_info'), sb.from('referrals').select('status')]);
    const ed = en.error ? null : (Array.isArray(en.data) ? en.data[0] : en.data);
    state.ent = ed || null;
    state.share = (!sh.error && Array.isArray(sh.data) && sh.data[0]) || null;
    state.refs = rf.error ? [] : (rf.data || []);
  } catch(e){ state.ent = null; state.share = null; state.refs = []; }
  await loadInvoices();
}
function offerImport(){
  const raw = localStorage.getItem('petrounds:data:' + state.user);
  if(state.visits.length || !raw) return;
  try {
    const l = JSON.parse(raw);
    if((l.visits || []).length && confirm(`Upload the ${l.visits.length} visits saved on this device to your account?`)){
      state.visits = l.visits.map(v => ({...v, id: uid()}));
      state.locked = l.locked || {}; state.invoices = l.invoices || {}; state.pay = l.pay || '';
      state.clearLocal = true; save();
    }
  } catch(e){}
}
async function loadInvoices(){
  try {
    const [iv, el] = await Promise.all([sb.from('invoices').select('*').neq('status', 'cancelled'), sb.from('email_log').select('*').order('id')]);
    state.invDb = {};
    (iv.data || []).forEach(r => { state.invDb[r.week_start + '|' + r.customer_email.toLowerCase()] = r; });
    state.mailLog = el.data || [];
  } catch(e){ state.invDb = {}; state.mailLog = []; }
}
async function applySession(sess){
  if(sess && sess.user){
    if(state.uid === sess.user.id && state.cloudReady) return;
    const m = sess.user.user_metadata || {};
    state.uid = sess.user.id; state.user = (sess.user.email || '').toLowerCase();
    state.profile = {first:m.first_name || '', last:m.last_name || '', business:m.business || ''};
    state.service = state.profile.business || 'Your business';
    state.loading = true; render();
    try { await loadCloud(); state.cloudReady = true; state.loadError = false; offerImport(); }
    catch(e){ state.loadError = true; }
    state.loading = false; render();
  } else {
    state.loading = false; state.user = null; state.profile = null; state.uid = null; state.cloudReady = false; render();
  }
}
window.addEventListener('beforeunload', e => { if(sb && state.sync === 'Saving…'){ e.preventDefault(); e.returnValue = ''; } });

function renderAuth(){
  if(state.authView === 'sent'){
    $('#app').innerHTML = `<div class="login">${LOGO}<h1>Check your email</h1><p>We sent a sign-in link to <b>${esc(state.pendingEmail)}</b>. Open it on this device to continue. No password needed.</p><button class="btn" id="back" style="width:100%">Use a different email</button></div>`;
    $('#back').onclick = () => { state.authView = 'login'; render(); };
    return;
  }
  const reg = state.authView === 'register';
  $('#app').innerHTML = `<form class="login" id="af">${LOGO}
    <div class="choices"><label><input type="radio" name="av" value="login" ${reg ? '' : 'checked'}><span>Log in</span></label><label><input type="radio" name="av" value="register" ${reg ? 'checked' : ''}><span>Register</span></label></div>
    ${reg ? `<div class="row"><div><label for="fn">First name</label><input type="text" id="fn" required autocomplete="given-name"></div><div><label for="ln">Last name</label><input type="text" id="ln" required autocomplete="family-name"></div></div>
    <label for="bz">Business name</label><input type="text" id="bz" required maxlength="60" autocomplete="organization">${sb ? `<label for="rc">Referral code (optional)</label><input type="text" id="rc" maxlength="20" autocapitalize="characters" value="${esc(REF_PARAM)}">` : ''}` : ''}
    <label for="em">Email address</label><input type="email" id="em" required autocomplete="email" placeholder="you@example.com">
    <div class="msg" id="am"></div>
    <button class="btn primary" style="width:100%;margin-top:6px">${reg ? 'Create account' : 'Email me a sign-in link'}</button>
    <p style="font-size:13px;margin-top:14px">${sb ? 'No password needed. We email you a secure sign-in link each time.' : 'Demo mode: accounts and data stay on this device. Add your Supabase keys to switch on real accounts.'}</p></form>`;
  document.querySelectorAll('[name=av]').forEach(r => r.onchange = () => { const em = $('#em').value; state.authView = r.value; renderAuth(); $('#em').value = em; });
  $('#af').onsubmit = async e => {
    e.preventDefault();
    const email = $('#em').value.trim().toLowerCase(), msg = $('#am');
    if(!/^\S+@\S+\.\S+$/.test(email)){ msg.textContent = 'Enter a valid email address, like you@example.com.'; return; }
    const profile = reg ? {first:$('#fn').value.trim(), last:$('#ln').value.trim(), business:$('#bz').value.trim(), ref:$('#rc') ? $('#rc').value.trim().toUpperCase() : ''} : null;
    if(reg && !(profile.first && profile.last && profile.business)){ msg.textContent = 'Fill in your first name, last name and business name.'; return; }
    const noAccount = 'No account found for that email. Choose Register to create one.';
    if(sb){
      msg.textContent = 'Sending…';
      const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: reg, emailRedirectTo: location.origin + location.pathname,
        data: reg ? {first_name:profile.first, last_name:profile.last, business:profile.business, referral_code:profile.ref || undefined} : undefined } });
      if(error){ msg.textContent = /signups not allowed/i.test(error.message) ? noAccount : error.message; return; }
      state.pendingEmail = email; state.authView = 'sent'; render();
    } else {
      const pk = 'petrounds:profile:' + email;
      if(reg) localStorage.setItem(pk, JSON.stringify(profile));
      const saved = localStorage.getItem(pk);
      if(!saved){ msg.textContent = noAccount; return; }
      state.user = email; state.profile = JSON.parse(saved); state.service = state.profile.business;
      localStorage.setItem('petrounds:session', email); load(); render();
    }
  };
}

function statusHtml(){
  const e = sb && state.ent; if(!e) return '';
  if(!e.has_access) return `<div class="banner warn"><span>Your access has ended. You can still view your visits, but adding or changing them needs an active trial or subscription.</span></div>`;
  const d = e.days_remaining, end = fmtLong(new Date(e.subscription_end));
  const t = e.access_reason === 'free_trial' ? `Free trial: ${d} day${d === 1 ? '' : 's'} left (ends ${end})`
    : e.access_reason === 'referral_reward' ? `Free referral months: access until ${end}`
    : `${e.access_type === 'yearly' ? 'Yearly' : 'Monthly'} plan · ${e.auto_renew ? 'renews' : 'ends'} ${end}`;
  return `<p class="hint">${esc(t)}</p>`;
}
function inviteHtml(){
  if(!sb || !state.share) return '';
  const e = state.ent || {}, refs = state.refs || [], paying = refs.filter(r => r.status !== 'pending').length;
  return `<section class="weeks"><h3>Invite friends</h3>
    <p class="sub">When someone you invite becomes a paying customer you earn a free month, up to 2 free months in total.</p>
    <div class="wk"><div class="info"><b style="letter-spacing:.08em">${esc(state.share.referral_code)}</b>
    <small>${refs.length} invited · ${paying} paying · ${e.referral_months_earned || 0} free month${e.referral_months_earned === 1 ? '' : 's'} earned</small></div>
    <button class="btn primary" id="share">Share my referral code</button></div></section>`;
}
async function shareCode(){
  if(!state.share) return;
  const link = location.origin + location.pathname + '?ref=' + encodeURIComponent(state.share.referral_code);
  const text = state.share.message + ' ' + link;
  try {
    if(navigator.share){ await navigator.share({title: state.service, text}); }
    else { await navigator.clipboard.writeText(text); const b = $('#share'); if(b) b.textContent = 'Copied to clipboard'; }
  } catch(e){}
}

function render(){
  const app = $('#app');
  document.body.classList.toggle('authpage', !state.user);
  if(state.loading){ app.innerHTML = '<p class="empty" style="text-align:center;margin-top:90px">Loading…</p>'; return; }
  if(state.loadError){
    app.innerHTML = `<div class="login"><h1>Couldn't load your data</h1><p>Check your connection and try again.</p><button class="btn primary" id="retry" style="width:100%">Try again</button></div>`;
    $('#retry').onclick = () => { state.loadError = false; state.cloudReady = false; sb.auth.getSession().then(({data}) => applySession(data.session)); };
    return;
  }
  if(!state.user){ renderAuth(); return; }
  const now = new Date(), first = new Date(now.getFullYear(), now.getMonth()+state.offset, 1);
  const months = [0,1,2].map(i => new Date(first.getFullYear(), first.getMonth()+i, 1));
  app.innerHTML = `
  <header class="top"><div class="wrap"><div class="logo">${esc(state.service)}</div>
    <div class="session"><i class="dot" aria-hidden="true"></i><span class="em" title="${esc(state.user)}">${esc(state.profile && state.profile.first ? state.profile.first + ' ' + state.profile.last : state.user)}</span>
    <button class="btn ghost-w" id="logout">Log out</button></div></div></header>
  <main class="wrap">
    <div class="bar"><h2>${MONTHS[months[0].getMonth()]} to ${MONTHS[months[2].getMonth()]} ${months[2].getFullYear()}</h2>
      <div class="nav">
      <button class="btn primary" id="add">Add visit</button>
      <button class="btn" id="earn">Earnings Summary</button></div></div>
    <p class="hint" id="sync" style="text-align:right;margin:0${state.syncErr ? ';color:var(--warn)' : ''}">${sb ? esc(state.sync) : ''}</p>
    ${statusHtml()}
    ${dueWeeks().map(mk => `<div class="banner"><span>The week of ${fmtDay(parse(mk))} has ended. Its invoices are ready to send.</span><button class="btn primary" data-inv="${mk}">Review and send invoices</button></div>`).join('')}
    ${months.map(monthHtml).join('')}
    <section class="weeks" id="weeks"></section>
    ${inviteHtml()}
    <section class="weeks" id="contact"><h3>Contact Us</h3><p class="sub">Have a question, need help or want to get in touch?</p><button class="btn primary" id="contactBtn">Contact Us</button></section>
  </main>`;
  $('#logout').onclick = async () => {
    if(sb && state.sync === 'Saving…'){ clearTimeout(syncTimer); await syncNow(); }
    if(sb) {
      await sb.auth.signOut();
      state = {user:null, profile:null, authView:'login', pendingEmail:'', loading:false, service:DEFAULT_SERVICE, visits:[], locked:{}, invoices:{}, pay:'', offset:0};
    } else {
      // Login is temporarily disabled, so keep the app in local demo mode rather than returning to the login screen.
      state.user = 'demo@petsbehaving.local';
      state.profile = {first:'', last:'', business:DEFAULT_SERVICE};
      state.service = DEFAULT_SERVICE;
      load();
    }
    render();
  };
  $('#add').onclick = () => openAdd(todayKey);
  $('#earn').onclick = openEarn;
  if($('#share')) $('#share').onclick = shareCode;
  $('#contactBtn').onclick = openContact;
  $('#rf').onchange = async e => {
    const file = e.target.files[0]; if(!file) return;
    try {
      const d = JSON.parse(await file.text()); if(!Array.isArray(d.visits)) throw 0;
      if(!confirm('Replace all current data with this backup?')) return;
      state.visits = d.visits.map(v => ({...v, id: sb ? uid() : v.id})); state.locked = d.locked||{}; state.invoices = d.invoices||{}; state.pay = d.pay||'';
      if(d.service){ state.service = d.service; localStorage.setItem('petrounds:service', d.service); }
      save(); render();
    } catch(err){ alert('That file is not a backup from this app.'); }
  };
  document.querySelectorAll('.day[data-k]').forEach(b => b.onclick = () => openDay(b.dataset.k));
  renderWeeks();
}

function monthHtml(m){
  const y = m.getFullYear(), mo = m.getMonth(), days = new Date(y,mo+1,0).getDate(), lead = (m.getDay()+6)%7;
  let cells = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="dow">${d}</div>`).join('');
  cells += '<div class="blank"></div>'.repeat(lead);
  let total = 0;
  for(let d=1; d<=days; d++){
    const k = `${y}-${pad(mo+1)}-${pad(d)}`, vs = visitsOn(k), t = sumPrice(vs), wd = parse(k).getDay();
    total += t;
    const cls = ['day', [0,6].includes(wd)?'we':'', k<todayKey?'past':'', k===todayKey?'today':'', isLocked(k)?'locked':''].join(' ');
    cells += `<button class="${cls}" data-k="${k}" aria-label="${fmtDay(parse(k))}, ${vs.length} visits, ${money(t)}${isLocked(k)?', week locked':''}">
      <span class="n">${d}${isLocked(k)?' 🔒':''}</span>
      <span class="pets">${vs.slice(0,6).map(v=>`<i class="pip ${v.type}${v.done?' done':''}"></i>`).join('')}</span>
      <span class="earn ${t?'':'zero'}">${money(t)}</span></button>`;
  }
  return `<section class="month"><h3>${MONTHS[mo]} ${y} <small style="font:500 15px Figtree;color:var(--mute)">${money(total)} booked</small></h3><div class="grid">${cells}</div></section>`;
}

function renderWeeks(){
  const todayMon = key(mondayOf(new Date()));
  let html = `<h3>Weekly Summary</h3><p class="sub">Lock a week once it is final. Locked weeks can't be edited, and you can send the client list as a weekly summary.</p>`;

  // Keep the original full weekly section/functionality, but display only four weeks.
  // Each row retains: date range, visit/revenue summary, weekly summary action,
  // invoice action where applicable, and the Lock/Unlock control on the far right.
  for(let i = 0; i < 4; i++){
    const d = addDays(parse(todayMon), i * 7);
    const mk = key(d);
    const end = addDays(d, 6);
    const vs = weekVisits(mk);
    const lk = !!state.locked[mk];

    html += `
      <div class="wk" data-week="${mk}">
        <div class="info">
          <b>${fmtDay(d)} to ${fmtDay(end)} ${lk ? '<span class="tag">Locked</span>' : ''}</b>
          <small>${vs.length} visit${vs.length === 1 ? '' : 's'} · ${money(weekTotal(mk))}</small>
        </div>
        ${lk ? `<button class="btn" data-send="${mk}">Send Weekly Summary</button>
                <button class="btn primary" data-inv="${mk}">Invoices</button>` : ''}
        <button class="btn" data-lock="${mk}" aria-label="${lk ? 'Unlock' : 'Lock'} week ${fmtDay(d)}">
          ${lk ? 'Unlock week' : 'Lock week'}
        </button>
      </div>`;
  }

  $('#weeks').innerHTML = html;

  document.querySelectorAll('[data-lock]').forEach(b => b.onclick = () => {
    const mk = b.dataset.lock;
    if(!canWrite()) return blocked();
    if(state.locked[mk]) delete state.locked[mk];
    else state.locked[mk] = true;
    save();
    render();
  });

  document.querySelectorAll('[data-inv]').forEach(b => b.onclick = () => openInvoices(b.dataset.inv));
  document.querySelectorAll('[data-send]').forEach(b => b.onclick = () => openSummary(b.dataset.send));
}

/* ---------- dialogs ---------- */
const dlg = $('#dlg');
const show = html => { $('#dlgBody').innerHTML = html; if(!dlg.open) dlg.showModal(); };
const close = () => dlg.close();

function toggleDone(id){ if(!canWrite()) return blocked(); state.visits = state.visits.map(v => v.id === id ? {...v, done:!v.done} : v); save(); }

function openDay(k){
  const vs = visitsOn(k), lk = isLocked(k), d = parse(k);
  show(`<h2>${d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</h2>
    <p class="empty" style="margin-top:0">${vs.length} visit${vs.length===1?'':'s'} · ${money(dayTotal(k))}${lk?' · week locked':''}</p>
    ${vs.length ? vs.map(v => `<div class="visit"><div class="h"><span>${esc(v.time)} ${esc(v.name)} (${v.type}) · ${money(visitPrice(v))}</span>
      <span style="display:flex;gap:4px"><button class="btn" data-edit="${v.id}" ${lk?'disabled':''} style="padding:2px 10px">Edit</button><button class="btn" data-copy="${v.id}" style="padding:2px 10px">Copy</button><button class="btn danger" data-del="${v.id}" ${lk?'disabled':''} style="padding:2px 10px">Delete</button></span></div>
      <small>${esc(v.address)}, ${esc(v.postcode)} · ${esc(v.slot)}${v.hname ? ' · ' + esc(v.hname) : ''}</small><label style="margin:2px 0;font-weight:500"><input type="checkbox" data-done="${v.id}" ${v.done?'checked':''}> Done</label><small>Access: ${esc(v.access)}${v.keycode?' ('+esc(v.keycode)+')':''}</small>
      ${v.food?`<small>Food: ${esc(v.food)}</small>`:''}${v.meds?`<small>Medication: ${esc(v.meds)}</small>`:''}${v.vet?`<small>Vet: ${esc(v.vet)}</small>`:''}${v.notes?`<small>Notes: ${esc(v.notes)}</small>`:''}</div>`).join('')
      : '<p class="empty">No visits yet. Add the first one for this day.</p>'}
    <div class="actions"><button class="btn" id="x">Close</button><button class="btn primary" id="addHere" ${lk?'disabled':''}>Add visit on this day</button></div>`);
  $('#x').onclick = close;
  $('#addHere').onclick = () => openAdd(k);
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openAdd(k, vs.find(v => v.id === b.dataset.edit)));
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => openAdd(k, {...vs.find(v => v.id === b.dataset.copy), id:'', date:k}));
  document.querySelectorAll('[data-done]').forEach(b => b.onchange = () => { toggleDone(b.dataset.done); render(); openDay(k); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    state.visits = state.visits.filter(v => v.id !== b.dataset.del); save(); render(); openDay(k);
  });
}

function openAdd(k, ed){
  if(!canWrite()) return blocked();
  const pets = [...new Map(state.visits.map(v => [(v.name+'|'+v.hemail).toLowerCase(), v])).values()];
  show(`<h2>${ed && ed.id ? 'Edit visit' : 'Add new visit'}</h2><form id="vf">
    ${pets.length && !ed ? `<label for="f-pet">Use a saved pet</label><select id="f-pet"><option value="">New pet</option>${pets.map((v,i) => `<option value="${i}">${esc(v.name)} (${esc(v.hname || v.hemail)})</option>`).join('')}</select>` : ''}
    <div class="row"><div><label for="f-name">Animal name</label><input type="text" id="f-name" required></div>
    <div><label for="f-date">Date</label><input type="date" id="f-date" value="${k}" ${ed && ed.id ? '' : 'min="' + todayKey + '"'} required></div></div>
    <div class="row"><div><label for="f-hn">Household name</label><input type="text" id="f-hn" required></div>
    <div><label for="f-he">Household email (for invoices)</label><input type="email" id="f-he" required list="hh" autocomplete="off"></div></div>
    <datalist id="hh">${[...new Map(state.visits.filter(v=>v.hemail).map(v=>[v.hemail,v])).values()].map(v=>`<option value="${esc(v.hemail)}">${esc(v.hname)}</option>`).join('')}</datalist>
    <label>Pet type</label><div class="choices">
      <label><input type="radio" name="type" value="Dog" checked><span>🐕 Dog</span></label>
      <label><input type="radio" name="type" value="Cat"><span>🐈 Cat</span></label></div>
    <div class="row"><div><label for="f-addr">Address</label><input type="text" id="f-addr" required></div>
    <div><label for="f-pc">Postcode</label><input type="text" id="f-pc" required autocapitalize="characters"></div></div>
    <label>Time slot</label><div class="choices">${Object.keys(SLOTS).map((s,i)=>`<label><input type="radio" name="slot" value="${s}" ${i===0?'checked':''}><span>${s}</span></label>`).join('')}</div>
    <label for="f-price">Price for this visit (£)</label><input type="number" id="f-price" min="0" step="0.5" inputmode="decimal" required>
    <p class="empty" id="priceHint" style="margin:4px 0 0;font-size:13px"></p>
    <label for="f-time">Exact time</label><input type="time" id="f-time" value="08:00" required>
    ${ed && ed.id ? '' : `<div class="row"><div><label for="f-rep">Repeat</label><select id="f-rep"><option value="">Does not repeat</option><option value="d">Every day</option><option value="wd">Every weekday</option><option value="w">Every week, same day</option></select></div>
    <div><label for="f-until">Repeat until</label><input type="date" id="f-until"></div></div>`}
    <label for="f-food">Food preferences</label><textarea id="f-food" placeholder="e.g. half a pouch of chicken, wet food only"></textarea>
    <label for="f-meds">Medication</label><input type="text" id="f-meds" placeholder="e.g. one tablet in food, morning only">
    <label for="f-vet">Vet (name and phone)</label><input type="text" id="f-vet" placeholder="e.g. Riverside Vets, 01234 567890">
    <label for="f-notes">General instructions</label><textarea id="f-notes" placeholder="e.g. Put bin out, water plants"></textarea>
    <label for="f-acc">Access method</label><select id="f-acc">${ACCESS.map(a=>`<option>${a}</option>`).join('')}</select>
    <div id="kcWrap" hidden><label for="f-kc">Key safe / lockbox code</label><input type="text" id="f-kc"></div>
    <div class="msg" id="fm"></div>
    <div class="actions"><button type="button" class="btn" id="x">Cancel</button><button class="btn primary">Save visit</button></div></form>`);
  const f = $('#vf');
  $('#x').onclick = close;
  $('#f-he').onchange = e => { const m = state.visits.find(v => v.hemail === e.target.value.trim().toLowerCase()); if(m && !$('#f-hn').value) $('#f-hn').value = m.hname; };
  let priceEdited = false;
  const syncPrice = () => {
    const d = $('#f-date').value, def = d ? priceFor(d) : WEEKDAY_PRICE;
    $('#priceHint').textContent = `Standard rate for this day: ${money(def)}. Change it for a longer or special visit.`;
    if(!priceEdited) $('#f-price').value = def;
  };
  $('#f-price').oninput = () => { priceEdited = true; };
  $('#f-date').onchange = syncPrice;
  syncPrice();
  f.querySelectorAll('[name=slot]').forEach(r => r.onchange = () => $('#f-time').value = SLOTS[r.value]);
  $('#f-time').onchange = e => {
    const h = +e.target.value.slice(0,2), s = h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening';
    f.querySelector(`[name=slot][value=${s}]`).checked = true;
  };

  const fill = (v, withDate) => {
    const set = (id, val) => { $('#'+id).value = val ?? ''; };
    set('f-name',v.name); set('f-hn',v.hname); set('f-he',v.hemail); set('f-addr',v.address); set('f-pc',v.postcode);
    set('f-time',v.time || '08:00'); set('f-food',v.food); set('f-meds',v.meds); set('f-vet',v.vet); set('f-notes',v.notes);
    if(withDate) set('f-date',v.date);

    f.querySelector(`[name=slot][value=${v.slot || 'Morning'}]`).checked = true;
    $('#f-acc').value = v.access || ACCESS[0]; $('#kcWrap').hidden = !$('#f-acc').value.startsWith('Key safe'); set('f-kc',v.keycode);

    syncPrice();

  if(ed) fill(ed, true);
  f.onsubmit = e => {
    e.preventDefault();
    const date = $('#f-date').value;
    if(date < todayKey && !(ed && ed.id)){ $('#fm').textContent = 'Choose today or a future date.'; return; }
    const price = parseFloat($('#f-price').value);
    if(!(price >= 0)){ $('#fm').textContent = 'Enter a price of £0 or more.'; return; }
    if(isLocked(date)){ $('#fm').textContent = 'That week is locked. Unlock it to add visits.'; return; }

      vet: $('#f-vet').value.trim(), hname: $('#f-hn').value.trim(), hemail: $('#f-he').value.trim().toLowerCase(), name: $('#f-name').value.trim(), type: f.type.value, address: $('#f-addr').value.trim(),

      access: $('#f-acc').value, keycode: $('#f-acc').value.startsWith('Key safe') ? $('#f-kc').value.trim() : ''
    };
    if(ed && ed.id){
      state.visits = state.visits.map(v => v.id === ed.id ? {...v, ...base, date} : v);
    } else {
      const rp = $('#f-rep').value, until = $('#f-until').value;
      let dates = [date];
      if(rp){
        if(!until || until < date){ $('#fm').textContent = 'Choose a repeat-until date on or after the visit date.'; return; }
        dates = [];
        for(let d = parse(date); key(d) <= until && dates.length < 120; d = addDays(d, rp === 'w' ? 7 : 1)){
          if(rp === 'wd' && [0,6].includes(d.getDay())) continue;
          dates.push(key(d));
        }
      }
      const open = dates.filter(x => !isLocked(x));
      open.forEach((x,i) => state.visits.push({...base, date:x, id:uid(), price: (rp && !priceEdited) ? undefined : base.price}));
      if(open.length < dates.length) alert((dates.length - open.length) + ' visit(s) in locked weeks were skipped.');
    }
    save(); close(); render();
  };
}

function summaryText(mk){
  const vs = weekVisits(mk), s = parse(mk), e = addDays(s,6), L = [];
  L.push(`Weekly visit summary: ${fmtDay(s)} to ${fmtDay(e)} ${e.getFullYear()}`, `Service: ${state.service}`, `Sitter: ${state.user}`,
    `Total visits: ${vs.length}`, `Total expected revenue: ${money(weekTotal(mk))}`, '');
  let cur = '';
  vs.forEach(v => {
    if(v.date !== cur){ cur = v.date; L.push(fmtDay(parse(v.date)).toUpperCase()); }
    L.push(`  ${v.time} ${v.name} (${v.type}), ${money(visitPrice(v))}`,
      `    Address: ${v.address}, ${v.postcode}`);
    if(v.meds) L.push(`    Medication: ${v.meds}`);
    if(v.notes) L.push(`    Instructions: ${v.notes}`);
    L.push('');
  });
  if(!vs.length) L.push('No visits booked this week.');
  return L.join('\n');
}

function openRun(k){
  const vs = visitsOn(k);
  show(`<h2>Run sheet</h2><label for="rd">Date</label><input type="date" id="rd" value="${k}">
    <p class="empty">${fmtLong(parse(k))} · ${vs.length} visit${vs.length===1?'':'s'} · ${money(sumPrice(vs))}</p>
    ${vs.map(v => `<div class="visit"><div class="h"><span>${esc(v.time)} ${esc(v.name)} (${v.type})</span><span>${money(visitPrice(v))}</span></div>
      <small>${esc(v.address)}, ${esc(v.postcode)}${v.hname ? ' · ' + esc(v.hname) : ''}</small>
      <small>Access: ${esc(v.access)}${v.keycode ? ' (code: ' + esc(v.keycode) + ')' : ''}</small>
      ${v.food ? `<small>Food: ${esc(v.food)}</small>` : ''}${v.meds ? `<small>Medication: ${esc(v.meds)}</small>` : ''}${v.vet ? `<small>Vet: ${esc(v.vet)}</small>` : ''}${v.notes ? `<small>Notes: ${esc(v.notes)}</small>` : ''}
      <label style="margin:4px 0 0;font-weight:500"><input type="checkbox" data-done="${v.id}" ${v.done ? 'checked' : ''}> Done</label></div>`).join('') || '<p class="empty">No visits on this day.</p>'}
    <div class="actions"><button class="btn" id="x">Close</button><button class="btn primary" id="pr">Print</button></div>`);
  $('#x').onclick = close;
  $('#pr').onclick = () => window.print();
  $('#rd').onchange = e => { if(e.target.value) openRun(e.target.value); };
  document.querySelectorAll('[data-done]').forEach(b => b.onchange = () => { toggleDone(b.dataset.done); render(); openRun(k); });
}

function openEarn(){
  const n = new Date(), wk = key(mondayOf(n)), m0 = key(new Date(n.getFullYear(), n.getMonth(), 1)),
    m1 = key(new Date(n.getFullYear(), n.getMonth()+1, 1)), m2 = key(new Date(n.getFullYear(), n.getMonth()+2, 1));
  const per = [['This week', v => key(mondayOf(parse(v.date))) === wk], ['This month', v => v.date >= m0 && v.date < m1],
    ['Next month', v => v.date >= m1 && v.date < m2], ['Upcoming', v => v.date >= todayKey], ['All booked', () => true]];
  let owed = 0, paid = 0;
  Object.keys(state.invoices).forEach(k => {
    const [mk, em] = k.split('|'), h = households(mk).find(x => x.email === em), st = state.invoices[k];
    if(!h) return;
    if(st.paid) paid += sumPrice(h.visits); else if(st.sent) owed += sumPrice(h.visits);
  });
  show(`<h2>Earnings Summary</h2><table><tr><th></th><th>Visits</th><th>Dogs</th><th>Cats</th><th>Total</th></tr>
    ${per.map(([name,f]) => { const vs = state.visits.filter(f);
      return `<tr><td>${name}</td><td>${vs.length}</td><td>${money(sumPrice(vs.filter(v => v.type==='Dog')))}</td><td>${money(sumPrice(vs.filter(v => v.type==='Cat')))}</td><td><b>${money(sumPrice(vs))}</b></td></tr>`; }).join('')}</table>
    <p class="empty">Invoices paid: <b>${money(paid)}</b> · Invoiced and still unpaid: <b>${money(owed)}</b></p>
    <div class="actions"><button class="btn primary" id="x">Close</button></div>`);
  $('#x').onclick = close;
}

function openInvoices(mk){
  if(!state.locked[mk]){ state.locked[mk] = true; save(); render(); }
  const hs = households(mk), s = parse(mk), e = addDays(s,6);
  show(`<h2>Invoices: ${fmtDay(s)} to ${fmtDay(e)}</h2>
    <p class="empty" style="margin-top:0">One invoice per household, due 7 days after the week ends. Email invoice opens your email app with the invoice filled in. Invoicing locks the week.</p>
    <label for="pay">Payment details (shown on every invoice)</label><textarea id="pay" placeholder="e.g. Bank transfer to 00-00-00, account 00000000, reference: invoice number">${esc(state.pay)}</textarea>
    ${hs.map((h,i) => { const st = inv(mk,h.email); return `<div class="visit"><div class="h"><span>${esc(h.name)}</span><span>${money(sumPrice(h.visits))}</span></div>
      <small>${esc(h.email || 'No email saved for this household')} · ${h.visits.length} visit${h.visits.length===1?'':'s'}</small>
      <div style="margin:6px 0">${st.sent?'<span class="tag">Sent</span> ':''}${st.paid?'<span class="tag paid">Paid</span>':''}</div>
      <details><summary>View invoice</summary><div class="preview" style="margin-top:6px">${esc(invoiceText(mk,h))}</div></details>
      <div class="actions" style="margin-top:8px"><button class="btn" data-paid="${i}">${st.paid?'Mark unpaid':'Mark paid'}</button>
      <button class="btn primary" data-mail="${i}" ${h.email?'':'disabled'}>${sb ? ((state.invDb || {})[mk + '|' + h.email] ? 'View invoice' : 'Create invoice') : (st.sent ? 'Resend invoice' : 'Email invoice')}</button></div></div>`; }).join('') || '<p class="empty">No visits this week.</p>'}
    <div class="actions"><button class="btn" id="x">Close</button></div>`);
  $('#x').onclick = close;
  $('#pay').oninput = ev => { state.pay = ev.target.value; save(); };
  document.querySelectorAll('[data-paid]').forEach(b => b.onclick = () => {
    const h = hs[b.dataset.paid], k = mk+'|'+h.email;
    state.invoices[k] = {...inv(mk,h.email), paid: !inv(mk,h.email).paid}; save(); render(); openInvoices(mk);
  });
  document.querySelectorAll('[data-mail]').forEach(b => b.onclick = () => {
    const h = hs[b.dataset.mail];
    if(sb) return openInvoiceDialog(mk, h);
    state.invoices[mk+'|'+h.email] = {...inv(mk,h.email), sent:true}; save();
    location.href = `mailto:${encodeURIComponent(h.email)}?subject=${encodeURIComponent(state.service + ' invoice ' + invNo(mk,h.email))}&body=${encodeURIComponent(invoiceText(mk,h))}`;
    setTimeout(() => { render(); openInvoices(mk); }, 300);
  });
}

function openContact(){
  const pr = state.profile || {};
  show(`<h2>Contact us</h2><form id="cf">
    <label for="cn">Name</label><input type="text" id="cn" required maxlength="100" value="${esc(((pr.first || '') + ' ' + (pr.last || '')).trim())}">
    <label for="ce">Email</label><input type="email" id="ce" required maxlength="200" value="${esc(state.user || '')}">
    <label for="cm">Message</label><textarea id="cm" required maxlength="5000" style="min-height:160px" placeholder="Tell us what you need help with"></textarea>
    <div class="msg" id="cmsg"></div>
    <div class="actions"><button type="button" class="btn" id="x">Cancel</button><button class="btn primary" id="cs">Send Message</button></div></form>`);
  $('#x').onclick = close;
  $('#cf').onsubmit = async e => {
    e.preventDefault();
    const msg = $('#cmsg'), b = $('#cs'), name = $('#cn').value.trim(), email = $('#ce').value.trim(), text = $('#cm').value.trim();
    if(!name || !text || !/^\S+@\S+\.\S+$/.test(email)){ msg.textContent = 'Enter your name, a valid email address and a message.'; return; }
    if(!sb){ msg.textContent = 'Contact needs a signed-in account.'; return; }
    b.disabled = true; b.textContent = 'Sending…'; msg.textContent = '';
    const { data: cid, error } = await sb.rpc('submit_contact_message', {p_name:name, p_email:email, p_message:text});
    if(error){
      b.disabled = false; b.textContent = 'Send Message';
      msg.textContent = /RATE_LIMIT/.test(error.message) ? 'You have sent a few messages recently. Please wait a little and try again.' : 'Sorry, your message could not be sent. Please try again.';
      return;
    }
    const r = await sb.functions.invoke('send-contact', { body: { id: cid } });
    const res = r.data || {};
    if(r.error || res.owner !== 'sent'){
      b.disabled = false; b.textContent = 'Send Message';
      msg.textContent = 'Sorry, your message could not be sent. Please try again in a few minutes.';
      return;
    }
    $('#cf').innerHTML = `<p style="font-size:16px">${res.copy === 'sent' ? 'Thanks, your message has been sent. A copy has been emailed to you.' : 'Thanks, your message has been sent. We could not email you a copy.'}</p><div class="actions"><button type="button" class="btn primary" id="x2">Close</button></div>`;
    $('#x2').onclick = close;
  };
}

function openInvoiceDialog(mk, h){
  const ex = (state.invDb || {})[mk + '|' + h.email];
  if(ex) return showInvoice(ex);
  const total = sumPrice(h.visits);
  show(`<h2>Create invoice</h2>
    <label for="pt" style="font-size:16px">Payment terms (days)</label><input type="number" id="pt" min="0" max="365" value="7" style="font-size:18px">
    <p class="empty" style="margin:4px 0 10px">Due date: <b id="dd"></b></p>
    <div class="preview">${esc(h.visits.map(v => `${fmtDay(parse(v.date))} ${v.time}  ${v.name} (${v.type})  ${money(visitPrice(v))}`).join('\n'))}\n\nTotal ${money(total)}</div>
    <p class="empty">Bill to: ${esc(h.name)} (${esc(h.email)}). The server works out the final total.</p><div class="msg" id="im"></div>
    <div class="actions"><button class="btn" id="x">Cancel</button><button class="btn primary" id="mk">Create invoice</button></div>`);
  const upd = () => { const n = parseInt($('#pt').value, 10); $('#dd').textContent = (n >= 0 && n <= 365) ? fmtLong(addDays(new Date(), n)) : 'enter 0 to 365 days'; };
  $('#pt').oninput = upd; upd();
  $('#x').onclick = close;
  $('#mk').onclick = async () => {
    const n = parseInt($('#pt').value, 10), msg = $('#im'), b = $('#mk');
    if(!(n >= 0 && n <= 365)){ msg.textContent = 'Enter payment terms between 0 and 365 days.'; return; }
    b.disabled = true; b.textContent = 'Creating…'; msg.textContent = '';
    const { error } = await sb.rpc('create_invoice', {p_week: mk, p_customer_email: h.email, p_terms: n});
    await loadInvoices();
    const inv = state.invDb[mk + '|' + h.email];
    if(inv && (!error || /ALREADY_INVOICED/.test(error.message))) return showInvoice(inv);
    b.disabled = false; b.textContent = 'Create invoice';
    const m = error ? error.message : '';
    msg.textContent = /WEEK_NOT_LOCKED/.test(m) ? 'Lock this week before invoicing it.' : /NO_ACCESS/.test(m) ? 'Your access has ended.' : 'Sorry, the invoice could not be created. Please try again.';
  };
}

function showInvoice(inv, note){
  const logs = (state.mailLog || []).filter(l => l.invoice_id === inv.id);
  const last = k => logs.filter(x => x.kind === k).pop();
  const stat = k => { const l = last(k); return !l ? 'Not sent' : l.status === 'sent' ? 'Sent' : l.status === 'failed' ? 'Failed (' + esc(l.error || 'error') + ')' : 'Sending'; };
  const custSent = (last('invoice_customer') || {}).status === 'sent', ownSent = (last('invoice_owner') || {}).status === 'sent';
  const rows = inv.lines.map(l => `<tr><td style="text-align:left">${fmtDay(parse(l.date))} ${esc(l.time)}</td><td style="text-align:left">${esc(l.description)}</td><td>${money(Number(l.amount))}</td></tr>`).join('');
  show(`<h2>${esc(inv.invoice_number)}</h2>
    <div class="preview" style="white-space:normal;line-height:1.5"><b style="font-size:16px">${esc(inv.business_name)}</b><br>
      Invoice date: ${fmtLong(parse(inv.invoice_date))}<br>Payment terms: ${inv.payment_terms_days} days · <b>Due: ${fmtLong(parse(inv.due_date))}</b><br><br>
      Bill to: ${esc(inv.customer_name)}<br>${esc(inv.customer_address || '')}<br>${esc(inv.customer_email)}<br>Pets: ${esc(inv.pet_names || '')}
      <table style="margin:8px 0">${rows}</table><b>Total: ${money(Number(inv.total))}</b>
      ${inv.payment_details ? '<br><br>' + esc(inv.payment_details).replace(/\n/g, '<br>') : ''}</div>
    <p class="empty">Status: <b>${esc(inv.status)}</b><br>To customer: ${stat('invoice_customer')}<br>Owner copy: ${stat('invoice_owner')}</p>
    <div class="msg" id="im">${note ? esc(note) : ''}</div>
    <div class="actions"><button class="btn" id="x">Close</button>${custSent && ownSent ? '' : `<button class="btn primary" id="snd">${custSent ? 'Retry owner copy' : 'Send invoice'}</button>`}</div>`);
  $('#x').onclick = close;
  if(!$('#snd')) return;
  $('#snd').onclick = () => {
    show(`<h2>Send invoice?</h2><p>Send invoice to: <b>${esc(inv.customer_email)}</b>?</p>
      <p class="empty">A copy will also be sent to: <b>${esc(inv.business_email)}</b></p>
      <div class="preview" style="white-space:normal">Customer: ${esc(inv.customer_name)}<br>Invoice: ${esc(inv.invoice_number)}<br>Total: ${money(Number(inv.total))}<br>Due: ${fmtLong(parse(inv.due_date))}</div>
      <div class="msg" id="im"></div>
      <div class="actions"><button class="btn" id="bk2">Back</button><button class="btn primary" id="go">Confirm and send</button></div>`);
    $('#bk2').onclick = () => showInvoice(inv);
    $('#go').onclick = async () => {
      const b = $('#go'); b.disabled = true; b.textContent = 'Sending…';
      const { data, error } = await sb.functions.invoke('send-invoice', { body: { invoice_id: inv.id } });
      await loadInvoices();
      const fresh = Object.values(state.invDb).find(r => r.id === inv.id) || inv;
      const ok = !error && data && !data.error;
      showInvoice(fresh, ok ? (data.customer === 'failed' ? 'The customer email failed. You can try again.' : data.owner === 'failed' ? 'Sent to the customer, but your owner copy failed. You can retry it.' : 'Invoice sent.') : 'Sorry, the invoice could not be sent. Please try again.');
      render();
    };
  };
}

function openSummary(mk){
  const txt = summaryText(mk);
  show(`<h2>Weekly summary email</h2><p class="empty" style="margin-top:0">Check the draft, then copy it or open it in your email app.</p>
    <label for="to">Send to</label><input type="email" id="to" placeholder="recipient@example.com">
    <label>Draft</label><div class="preview" id="pv">${esc(txt)}</div>
    <div class="actions"><button class="btn" id="x">Close</button><button class="btn" id="cp">Copy text</button><button class="btn primary" id="mail">Open in email app</button></div>`);
  $('#x').onclick = close;
  $('#cp').onclick = async () => {
    try { await navigator.clipboard.writeText(txt); $('#cp').textContent = 'Copied'; } catch(e){ $('#cp').textContent = 'Copy failed, select the text instead'; }
  };
  $('#mail').onclick = () => {
    const s = parse(mk);
    location.href = `mailto:${encodeURIComponent($('#to').value.trim())}?subject=${encodeURIComponent(state.service + ' – weekly visit summary: week of ' + fmtDay(s))}&body=${encodeURIComponent(txt)}`;
  };
}

if(sb){
  sb.auth.getSession().then(({data}) => applySession(data.session)).catch(() => applySession(null));
  sb.auth.onAuthStateChange((ev, sess) => { if(ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') applySession(sess); });
} else { load(); render(); }
})();
</script>
</body>
